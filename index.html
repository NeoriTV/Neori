<script>
var lampa_url='';var cache_version=Math.floor((new Date()).getTime()/9e5);
function urlJoin(base,add){if(base.charAt(base.length-1)!=='/')base+='/';return base+add}
function putScript(src,onload,onerror){var tries=0;function load(){var s=document.createElement('script');s.type='text/javascript';s.onload=s.onreadystatechange=function(){if(onload)onload()};s.onerror=function(){tries++;if(tries<3)load();else if(onerror)onerror();else{$('.no-network').removeClass('hide');$('.no-network__file').text(src)}};s.src=src;document.body.appendChild(s)}load()}
function loadLocal(){putScript('app.min.js?v='+cache_version,function(){})}
if(typeof AndroidJS!=='undefined'&&AndroidJS.getLampaURL&&/^https?:\\/\\//i.test(AndroidJS.getLampaURL())&&!/^https?:\\/\\//i.test(location.href))lampa_url=urlJoin(AndroidJS.getLampaURL(),'');
if(lampa_url){putScript(urlJoin(lampa_url,'lampainit.js?v='+cache_version),null,function(){});putScript(urlJoin(lampa_url,'app.min.js?v='+cache_version),function(){},function(){putScript(urlJoin(lampa_url,'lampa-main/app.min.js?v='+cache_version),function(){},loadLocal)})}else loadLocal();
</script>
